[package]
name = "exif-renamer"
version = "1.0.0"
description = "照片EXIF信息重命名工具"
authors = [""]
edition = "2021"

[lib]
name = "exif_renamer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
kamadak-exif = "0.5"
image = "0.25"
chrono = "0.4"
walkdir = "2"
base64 = "0.22"
rawloader = "0.37"
urlencoding = "2"
