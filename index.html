<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>照片EXIF重命名工具</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.js" defer></script>
  </head>
  <body>
    <div id="app">
      <header class="toolbar">
        <div class="toolbar-left">
          <button id="btn-select-files" class="btn btn-primary" title="选择照片文件">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>
            <span>选择文件</span>
          </button>
          <button id="btn-select-folder" class="btn btn-primary" title="选择照片文件夹">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
            <span>选择文件夹</span>
          </button>
          <div class="toolbar-divider"></div>
          <button id="btn-refresh" class="btn btn-secondary" title="刷新">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
            <span>刷新</span>
          </button>
          <button id="btn-rename" class="btn btn-accent" title="根据EXIF信息重命名">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
            <span>EXIF重命名</span>
          </button>
          <button id="btn-undo" class="btn btn-secondary" title="撤销重命名">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
            <span>撤销</span>
          </button>
          <button id="btn-clear" class="btn btn-danger" title="清空列表">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            <span>清空</span>
          </button>
        </div>
        <div class="toolbar-right">
          <button id="btn-help" class="btn btn-secondary" title="帮助文档">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            <span>帮助</span>
          </button>
          <span id="file-count" class="file-count">0 个文件</span>
        </div>
      </header>

      <div class="format-hint">
        重命名格式: YYYY-MM-DD HH-MM-SS，支持 JPEG、TIFF、CR2、CR3、ARW、NEF、ORF、RW2、DNG 等格式
      </div>

      <main class="content">
        <div class="file-list-panel" id="drop-zone">
          <div class="drop-overlay" id="drop-overlay">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            <p>拖放照片文件到此处</p>
          </div>
          <table class="file-table" id="file-table">
            <thead>
              <tr>
                <th class="col-idx">#</th>
                <th class="col-filename">文件名</th>
                <th class="col-time">拍摄时间</th>
                <th class="col-camera">相机型号</th>
                <th class="col-newname">新文件名</th>
                <th class="col-status">状态</th>
                <th class="col-action">操作</th>
              </tr>
            </thead>
            <tbody id="file-table-body">
            </tbody>
          </table>
          <div class="empty-state" id="empty-state">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            <p>点击"选择文件"或"选择文件夹"添加照片</p>
            <p class="empty-hint">也可以直接拖放文件到此处</p>
          </div>
        </div>

        <div class="resizer" id="resizer"></div>

        <div class="preview-panel" id="preview-panel">
          <div class="preview-section">
            <h3 class="section-title">预览</h3>
            <div class="preview-image-container" id="preview-container">
              <div class="no-preview" id="no-preview">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                <p>选择文件以预览</p>
              </div>
              <img id="preview-image" class="preview-image" style="display:none" alt="预览" />
            </div>
          </div>

          <div class="preview-section">
            <h3 class="section-title">文件信息</h3>
            <div class="info-content" id="file-info-content">
              <p class="no-info">选择文件查看信息</p>
            </div>
          </div>

          <div class="preview-section">
            <h3 class="section-title">EXIF信息</h3>
            <div class="info-content" id="exif-info-content">
              <p class="no-info">选择文件查看EXIF信息</p>
            </div>
          </div>
        </div>
      </main>

      <footer class="status-bar">
        <span id="status-text">就绪</span>
      </footer>
    </div>
  </body>
</html>
